---
layout: default
---

<article class="content">
	<header class="mb-5">
		<h1 class="title is-3">{{ page.title }}</h1>
		{% if page.excerpt %}
		<p class="subtitle is-5">{{ page.excerpt }}</p>
		{% endif %}
		<p class="subtitle is-6 has-text-grey">
			<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
		</p>
	</header>
	{{ content }}
	<p class="mt-5"><a href="{{ '/blogs/' | relative_url }}">← Back to Blog</a></p>
</article>
